<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Achadinhos Conecta - Painel da Fabi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #d35400; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #e67e22; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #d35400; }
        .resultado-box { margin-top: 30px; background: #fdfefe; border: 1px solid #e1e8ed; padding: 20px; border-radius: 8px; display: none; }
        .info-grid { display: flex; gap: 15px; margin-bottom: 15px; }
        .info-card { flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px; border-left: 4px solid #e67e22; font-size: 14px; }
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fffdf9; box-sizing: border-box; }
        .btn-copiar { background: #27ae60; margin-top: 10px; }
        .btn-copiar:hover { background: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛍️ Achadinhos Conecta (Automação 1 Clique)</h2>
    
    <div class="form-group">
        <label>Cole o Link Encurtado (Shopee ou Mercado Livre):</label>
        <input type="text" id="urlInput" placeholder="Ex: https://s.shopee.com.br/...">
    </div>

    <button onclick="processarAchadinho()">Processar e Gerar Anúncio Automaticamente 🚀</button>

    <div class="resultado-box" id="resultadoBox">
        <h3>✨ Anúncio Pronto para Validação</h3>
        
        <div class="info-grid">
            <div class="info-card" id="infoPlataforma"><b>Plataforma:</b> -</div>
            <div class="info-card" id="infoPreco"><b>Preço:</b> R$ -</div>
            <div class="info-card" id="infoComissao"><b>Comissão Est.:</b> R$ -</div>
        </div>

        <div class="form-group">
            <label>Título Identificado:</label>
            <input type="text" id="tituloRetorno" readonly>
        </div>

        <div class="form-group">
            <label>Copy Pronta (Estilo Rotativo):</label>
            <textarea id="copyRetorno"></textarea>
        </div>

        <button class="btn-copiar" onclick="copiarCopy()">Copiar Copy com 1 Clique 📋</button>
    </div>
</div>

<script>
    async function processarAchadinho() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) {
            alert('Por favor, cole o link do produto!');
            return;
        }

        const btn = document.querySelector('button');
        btn.innerText = 'Processando nos bastidores... ⏳';
        btn.disabled = true;

        try {
            // URL do seu backend hospedado no Vercel
            const resposta = await fetch('https://achadinhos-extrator.vercel.app/api/processar-achadinho', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const dados = await resposta.json();

            if (dados.success) {
                document.getElementById('infoPlataforma').innerHTML = `<b>Plataforma:</b> ${dados.plataforma}`;
                document.getElementById('infoPreco').innerHTML = `<b>Preço:</b> R$ ${dados.preco}`;
                document.getElementById('infoComissao').innerHTML = `<b>Comissão Est.:</b> R$ ${dados.comissao}`;
                document.getElementById('tituloRetorno').value = dados.titulo;
                document.getElementById('copyRetorno').value = dados.copyPronta;
                
                document.getElementById('resultadoBox').style.display = 'block';
            } else {
                alert('Erro ao processar: ' + (dados.error || 'Erro desconhecido'));
            }
        } catch (erro) {
            alert('Erro de conexão com o extrator: ' + erro.message);
        } finally {
            btn.innerText = 'Processar e Gerar Anúncio Automaticamente 🚀';
            btn.disabled = false;
        }
    }

    function copiarCopy() {
        const textarea = document.getElementById('copyRetorno');
        textarea.select();
        document.execCommand('copy');
        alert('Copy copiada com sucesso para a transferência!');
    }
</script>

</body>
</html>
