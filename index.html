<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achadinhos Conecta - Painel de Gestão</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff3b30; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        button { background-color: #ff3b30; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #d32f2f; }
        #resultado { margin-top: 25px; padding: 15px; background: #f9f9f9; border-left: 4px solid #ff3b30; border-radius: 4px; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛍️ Achadinhos Conecta</h1>
    <form id="produtoForm">
        <div class="form-group">
            <label for="titulo">Título do Produto:</label>
            <input type="text" id="titulo" required placeholder="Ex: Fritadeira Sem Óleo Air Fryer">
        </div>
        
        <div class="form-group">
            <label for="plataforma">Plataforma:</label>
            <select id="plataforma">
                <option value="Shopee">Shopee</option>
                <option value="Mercado Livre">Mercado Livre</option>
            </select>
        </div>

        <div class="form-group">
            <label for="categoria">Categoria:</label>
            <input type="text" id="categoria" placeholder="Ex: Casa, Cozinha, Eletrónicos">
        </div>

        <div class="form-group">
            <label for="preco">Preço (R$):</label>
            <input type="number" step="0.01" id="preco" placeholder="149.90">
        </div>

        <div class="form-group">
            <label for="comissao_estimada">Comissão Estimada (R$):</label>
            <input type="number" step="0.01" id="comissao_estimada" placeholder="15.00">
        </div>

        <div class="form-group">
            <label for="link_original">Link Original:</label>
            <input type="url" id="link_original" placeholder="https://shopee.com.br/produto...">
        </div>

        <div class="form-group">
            <label for="link_afiliado">Link de Afiliado (Pronto):</label>
            <input type="url" id="link_afiliado" required placeholder="https://s.shopee.com.br/seu-link">
        </div>

        <button type="submit">Cadastrar e Gerar Copy com IA 🚀</button>
    </form>

    <div id="resultado"></div>
</div>

<script>
    const form = document.getElementById('produtoForm');
    const resultadoDiv = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const dados = {
            titulo: document.getElementById('titulo').value,
            plataforma: document.getElementById('plataforma').value,
            categoria: document.getElementById('categoria').value,
            preco: parseFloat(document.getElementById('preco').value) || 0,
            comissao_estimada: parseFloat(document.getElementById('comissao_estimada').value) || 0,
            link_original: document.getElementById('link_original').value,
            link_afiliado: document.getElementById('link_afiliado').value
        };

        resultadoDiv.style.display = 'block';
        resultadoDiv.innerHTML = '⏳ A cadastrar o produto e a pedir a magia ao Gemini...';

        try {
            // 1. Cadastra o produto
            const response = await fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const resultado = await response.json();

            if (response.ok) {
                const produtoId = resultado.produto.id;
                resultadoDiv.innerHTML = `✅ Produto cadastrado com ID ${produtoId}! A gerar copy com IA...`;

                // 2. Pede para a IA gerar a copy automaticamente para este ID
                const aiResponse = await fetch(`/api/gerar-copy/${produtoId}`, {
                    method: 'POST'
                });
                const aiResult = await aiResponse.json();

                if (aiResponse.ok) {
                    resultadoDiv.innerHTML = `🎉 **Sucesso Completo!**\n\n${aiResult.copyPronta}`;
                    form.reset();
                } else {
                    resultadoDiv.innerHTML = `⚠️ Produto salvo, mas ocorreu um erro ao gerar a copy: ${aiResult.error}`;
                }
            } else {
                resultadoDiv.innerHTML = `❌ Erro ao cadastrar: ${resultado.error}`;
            }
        } catch (err) {
            resultadoDiv.innerHTML = `❌ Erro de conexão com o servidor: ${err.message}`;
        }
    });
</script>

</body>
</html>
